name: Docs

# Build the MkDocs site on every PR (sanity check) and deploy it to
# GitHub Pages on every push to ``master``. The deploy job uses the
# official ``actions/deploy-pages`` action, so no ``gh-pages`` branch
# is needed — the artifact is published directly via the Pages API.
#
# One-time setup required in repo settings:
#   1. Settings → Pages → Source = "GitHub Actions"
#   2. (Public repo only) Settings → Actions → General → Workflow
#      permissions = "Read and write" OR keep the default and rely on
#      the ``permissions:`` block below.

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

# Restrict default token to read-only; the deploy job opts in to the
# extra scopes it needs.
permissions:
  contents: read

# Only one Pages deploy may be in flight at a time. Cancel any older
# in-progress deploy so the most recent commit wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build MkDocs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed by some mkdocs plugins (e.g. git-revision-date) — also
          # cheap insurance for any future Material plugin that reads
          # commit history.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build site
        # ``mkdocs build`` is intentionally NOT strict — there are
        # pre-existing griffe warnings about untyped ``**kwargs`` on
        # the auto-generated AXL wrappers. The build still fails on
        # genuine errors (broken cross-references, syntax problems,
        # missing files), just not on those griffe warnings.
        run: mkdocs build

      - name: Upload site as Pages artifact
        # Only upload on push to master/main — PR builds are just a
        # sanity check and don't need to ship an artifact.
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    # Only deploy on push to master/main, not on PRs or branch builds.
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      pages: write       # required to deploy to GitHub Pages
      id-token: write    # required for OIDC-based deploy authentication
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
