name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short --cov=axltoolkit --cov-report=term-missing

      - name: Upload coverage (Python 3.12 only)
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: .coverage

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff

      - name: Ruff check
        run: ruff check axltoolkit/ tests/

      - name: Ruff format check
        run: ruff format --check axltoolkit/ tests/

  coverage-check:
    name: WSDL / client coverage check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify every WSDL operation has a Python wrapper
        run: python scripts/check_coverage.py --all-versions --include-sxml

  dependency-audit:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit

      - name: Scan dependencies for known vulnerabilities
        # Fails the job if any CVE is found in the installed dependency
        # tree (pip-audit exits non-zero on findings by default).
        # ``--desc`` includes CVE descriptions in the output so
        # reviewers can triage from the job log alone.
        # ``--skip-editable`` skips axltoolkit itself (installed via
        # ``pip install -e .``); we want to audit *dependencies*, not
        # the package under development, which isn't on PyPI yet
        # anyway.
        # ``--strict`` is intentionally NOT used here: it promotes any
        # warning (including the harmless "skipped editable" notice)
        # into a job failure, which would mask real findings.
        run: pip-audit --desc --skip-editable
